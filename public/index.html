<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resonanz – Himmelsatlas meiner Musik</title>
<meta name="description" content="Meine Hörgewohnheiten als Sternenhimmel: jeder Künstler ein Stern, jede Hörwelt eine Galaxie. Daten aus Spotify und MusicBrainz, gerechnet im Browser.">
<meta name="theme-color" content="#070914">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Resonanz – Himmelsatlas meiner Musik">
<meta property="og:description" content="Jeder Künstler ein Stern, jede Hörwelt eine Galaxie.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070914'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23ffb454' stroke-width='1'/%3E%3Ccircle cx='8' cy='9' r='1.2' fill='%23ff4fa3'/%3E%3Ccircle cx='25' cy='11' r='1' fill='%2338e8ff'/%3E%3Ccircle cx='23' cy='24' r='1.3' fill='%239b7bff'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-6p13ug9Y/2TWPZMF0aIT0xv2TqxNkp62hhuZFDN2uAM=' https://api.deezer.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.scdn.co; font-src 'self'; connect-src 'self' https://accounts.spotify.com https://api.spotify.com https://musicbrainz.org; media-src https://*.dzcdn.net; object-src 'none'; base-uri 'self'; form-action 'self'">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<link rel="modulepreload" href="vendor/three.module.min.js">
<link rel="modulepreload" href="app.js">
</head>
<body>
<div class="himmel" id="himmel">
  <canvas id="cv" aria-label="Sternenhimmel: ein Stern pro Künstler, farbig nach Hörwelt. Ziehen dreht den Blick." role="img" tabindex="0"></canvas>
  <div class="labels" id="labels" aria-hidden="true"></div>
  <div class="scheibe" aria-hidden="true"></div>
</div>

<header class="kartusche" id="kartusche">
  <h1>Resonanz</h1>
  <p class="unter">Himmelsatlas meiner Musik</p>
  <dl class="meta">
    <div><dt>Stand</dt><dd id="m-stand">…</dd></div>
    <div><dt>Quelle</dt><dd id="m-quelle">Spotify · MusicBrainz</dd></div>
    <div><dt>Blick</dt><dd id="m-blick">Az 0° · Hö 20°</dd></div>
  </dl>
  <p class="status" id="status" role="status">Lade den Himmel …</p>
  <button type="button" class="eigen-knopf" id="eigen-knopf">Dein eigener Himmel<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8M6.5 2.5 10 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
</header>

<section class="brett" id="brett" aria-label="Armaturenbrett">
  <div class="zeit" role="group" aria-label="Zeitraum">
    <span class="zeit-titel">Zeitraum</span>
    <div class="zeit-schalter" id="zeit">
      <button type="button" data-z="4w">4 W</button>
      <button type="button" data-z="6m">6 M</button>
      <button type="button" data-z="1y" aria-pressed="true">1 J</button>
      <i class="cursor" aria-hidden="true"></i>
    </div>
  </div>
  <ul class="legende" id="legende" aria-label="Hörwelten"></ul>
  <dl class="werte" id="werte">
    <div><dt>Sterne</dt><dd id="w-sterne">—</dd></div>
    <div><dt>Welten</dt><dd id="w-welten">—</dd></div>
    <div><dt>Sternbilder</dt><dd id="w-songs">—</dd></div>
  </dl>
</section>

<p class="hinweis" id="hinweis"><span>Ziehen dreht den Blick</span><span class="nur-tastatur">Pfeiltasten drehen, Tab springt zu den Welten</span></p>

<div class="buehne" id="buehne" aria-hidden="true"></div>
<main class="rueckblick" id="rueckblick"></main>
<a class="weiter" id="weiter" href="#k-welten">Scrollen für den Rückblick<svg width="12" height="14" viewBox="0 0 12 14" aria-hidden="true"><path d="M6 1v11M1.5 8.5 6 13l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></a>
<nav class="fluss" id="fluss" aria-label="Kapitel"></nav>

<noscript><p class="noscript">Resonanz braucht JavaScript: der Himmel wird im Browser aus einer JSON-Datei gerechnet.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
